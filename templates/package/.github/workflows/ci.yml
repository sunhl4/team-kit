name: ci
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: bash gates/check.sh
        env:
          TEAM_BASE: origin/main
          TEAM_HEAD_REF: ${{ github.head_ref }}
          TEAM_PR_BODY: ${{ github.event.pull_request.body }}
          TEAM_REQUIRE_BRANCH: ${{ github.event_name == 'pull_request' && '1' || '' }}
          TEAM_REQUIRE_PR_SPEC: ${{ github.event_name == 'pull_request' && '1' || '' }}
