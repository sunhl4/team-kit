gates:
  image: python:3.12
  script:
    - pip install -e ".[dev]"
    - |
      if [ "${CI_PIPELINE_SOURCE}" = "merge_request_event" ]; then
        export TEAM_REQUIRE_BRANCH=1 TEAM_REQUIRE_PR_SPEC=1
        export TEAM_HEAD_REF="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        export TEAM_PR_BODY="${CI_MERGE_REQUEST_DESCRIPTION}"
        export TEAM_BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-origin/main}"
      else
        export TEAM_BASE=origin/main
      fi
      bash gates/check.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
