name: team-kit
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest ruff import-linter hatchling
      - run: python -m pytest -q tests
      - run: bash scripts/day14_verify.sh /tmp/day14
